<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order OPPO FIND X9 ULTRA</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="order-page">
    <header>
      <nav class="navbar">
        <div class="navbar__logo">
          <a href="index.html">
            <span class="navbar__ultra">Ultra</span>
            Mobile<span class="navbar__trademark">&trade;</span>
          </a>
        </div>

        <ul class="navbar__links">
          <li><a class="navbar__link" href="index.html">Product</a></li>
          <li><a class="navbar__link" href="order.html">Order</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="order">
        <h1>Order OPPO FIND X9 ULTRA</h1>
        <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="address">Street address:</label>
          <input type="text" id="address" name="address" required />

          <label for="postal-code">Postal code:</label>
          <input type="text" id="postal-code" name="postal-code" required />

          <label for="city">City:</label>
          <input type="text" id="city" name="city" required />

          <fieldset>
            <legend>Choose color:</legend>
            <input
              type="radio"
              id="canyon-orange"
              name="color"
              value="canyon-orange"
              required
            />
            <label for="canyon-orange">Canyon Orange</label>

            <input
              type="radio"
              id="tundra-umber"
              name="color"
              value="tundra-umber"
            />
            <label for="tundra-umber">Tundra Umber</label>
          </fieldset>
          <label for="storage">Storage:</label>

          <select id="storage" name="storage" required>
            <option value="">Choose storage</option>
            <option value="512gb">512 GB</option>
            <option value="1tb">1 TB</option>
          </select>
          <label for="quantity">Quantity:</label>
          <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            value="1"
            required
          />

          <button type="submit">Place Order</button>
        </form>
      </section>
    </main>
    <footer>
      <p>
        This is a student project created for educational purposes and is not an
        official or affiliated OPPO website.
      </p>
    </footer>
  </body>
</html>
